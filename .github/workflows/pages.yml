name: Deploy to GitHub Pages

# Builds both colour versions on every push to main:
#   Flare & Ultra -> https://<owner>.github.io/<repo>/
#   Night Game    -> https://<owner>.github.io/<repo>/night/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and lint the full code
        run: npm run typecheck && npm run lint
      - name: Build both versions as static sites
        run: node scripts/build-pages.mjs
        env:
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}
          # Optional: set a repository variable INQUIRY_ENDPOINT to a form service URL.
          NEXT_PUBLIC_INQUIRY_ENDPOINT: ${{ vars.INQUIRY_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
